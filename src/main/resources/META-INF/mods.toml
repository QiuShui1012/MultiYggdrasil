modLoader = "javafml"
loaderVersion = "[31,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL = "${mod_homepage}"
authors="QiuShui1012"
description='''${mod_description}'''
logoFile = "icon.png"

[[dependencies."${mod_id}"]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_dependency}"
    ordering = "NONE"
    side="BOTH"
