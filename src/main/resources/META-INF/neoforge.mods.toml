modLoader="javafml"
loaderVersion="*"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
logoFile="icon.png"
displayURL = "${mod_homepage}"
authors="QiuShui1012"
#updateJSONURL="https://???.???/updates.json"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_dependency}"
    ordering="AFTER"
    side="BOTH"
