name: Update Release Assets
on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  setup:
    name: Setup Versions
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
      mod_id: ${{ steps.properties.outputs.mod.id }}
      mod_name: ${{ steps.properties.outputs.mod.name }}
    env:
      BUILD_TYPE: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod.id mod.name'

      - name: Setup Versions
        id: versions
        run: |
          VERSIONS=$(cat ./settings.json | tr -d '\r\n' | tr -d ' ')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  build:
    name: Build Version ${{ matrix.version }}
    permissions: write-all
    needs: setup
    strategy:
      matrix:
        version: ${{ fromJson(needs.setup.outputs.versions).versions }}
    uses: ./.github/workflows/build_and_test.yml
    with:
      version: ${{ matrix.version }}
      version_type: ${{ github.event.release.prerelease && 'snapshot' || 'release' }}
      ci_build: true
      pr_build: false
      mod_id: ${{ needs.setup.outputs.mod_id }}
      mod_name: ${{ needs.setup.outputs.mod_name }}
      gametest: true
