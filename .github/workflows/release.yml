name: Update Release Assets
on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  setup:
    name: Setup Environment
    uses: ./.github/workflows/setup.yml

  build:
    name: Build Version ${{ matrix.version }}
    permissions: write-all
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.setup.outputs.versions).versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Project
        run: ./gradlew build

      - name: Test and Publish
        uses: ./.github/workflows/build_and_test.yml
        with:
          version: ${{ matrix.version }}
          version_type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          ci_build: false
          pr_build: false
          mod_id: "${{ needs.setup.outputs.mod_id }}"
          mod_name: "${{ needs.setup.outputs.mod_name }}"
