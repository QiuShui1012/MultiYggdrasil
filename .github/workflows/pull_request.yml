name: Update Release Assets
on:
  workflow_dispatch:
  pull_request:
    branches:
      - releases/**
      - dev/**
    paths:
      - .github/workflows/pull_request.yml
      - src/**
      - versions/**
      - gradle/**
      - build.gradle
      - dependencies.gradle
      - gradle.properties
      - settings.gradle
      - settings.json

jobs:
  setup-root:
    name: Setup Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.settings.outputs.versions }}
    env:
      BUILD_TYPE: pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Properties
        id: 'properties'
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: 'mod_id mod_name'

      - name: Setup Java 21
        uses: actions/setup-java@v3.6.0
        with:
          distribution: zulu
          java-version: 21

      - name: Make Gradle Wrapper Executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v4.3.1

      - name: Build
        run: ./gradlew build

      - name: Copy all Jars into Right Folder
        run: ./gradlew copyAllJars

      - name: Setup Versions
        id: versions
        run: |
          JSON=$(cat ./settings.json)
          echo "versions=$JSON" >> $GITHUB_OUTPUT

  build:
    permissions: write-all
    runs-on: ubuntu-latest
    needs: setup-root
    strategy:
      matrix:
        version: ${{ fromJson(needs.setup-root.outputs.versions).versions }}
    steps:
      - name: Read Version Properties
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: versions/${{ matrix.version }}/gradle.properties
          properties: 'dependencies.minecraft_version loom.platform'

      - name: Get ${{ matrix.version }} Version
        id: version
        run: |
          MESSAGE=$(ls build/libs/${{ needs.setup-root.steps.properties.outputs.mod_id }}-${{ matrix.version }}-* | grep sources.jar -v | awk -F '${{ needs.setup-root.steps.properties.outputs.mod_id }}-${{ matrix.version }}-|.jar' '{print $2}')
          echo "version=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4.3.3
        with:
          name: "${{ needs.setup-root.steps.properties.outputs.mod_name }} ${{ matrix.version }} ${{ steps.version.outputs.version }}"
          path: build/libs/${{ needs.setup-root.steps.properties.outputs.mod_id }}-${{ matrix.version }}-${{ steps.version.outputs.version }}.jar

      - name: Run Game Test Server
        uses: Anvil-Dev/dedicated-server-launch-test@1.21.1-neoforge
        continue-on-error: false
        with:
          mod: build/libs/${{ needs.setup-root.steps.properties.outputs.mod_id }}-${{ matrix.version }}-${{ steps.version.outputs.version }}.jar

      - name: Publish Mod
        uses: Kir-Antipov/mc-publish@v3.3
        continue-on-error: true
        with:
          name: "${{ needs.setup-root.steps.properties.outputs.mod_name }} For ${{ steps.properties.outputs.loom.platform }} v${{ steps.version.outputs.version }}"
          version: ${{ steps.version.outputs.version }}
          game-versions: ${{ steps.properties.outputs.dependencies.minecraft_version }}
          version-type: ${{ needs.setup-root.env.VERSION_TYPE }}
          fail-mode: skip

          modrinth-id: LstvoJcB
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          curseforge-id: 1303093
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: |
            build/libs/${{ needs.setup-root.steps.properties.outputs.mod_id }}-${{ matrix.version }}-${{ steps.version.outputs.version }}.jar
            build/libs/${{ needs.setup-root.steps.properties.outputs.mod_id }}-${{ matrix.version }}-${{ steps.version.outputs.version }}-sources.jar
